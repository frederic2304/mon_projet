<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Inter,"Helvetica Neue",Arial,sans-serif;background:#faf8f3;color:#1a1a1a;width:1200px;padding:56px 64px;box-sizing:border-box}
h1{font-size:28px;margin:0 0 6px} p{color:#6b6457;margin:0 0 36px}
.row{display:flex;gap:40px;align-items:flex-end;margin-bottom:44px}
.cap{font-size:13px;color:#6b6457;text-align:center;margin-top:10px}
.logo{display:flex;align-items:center;gap:18px;font-size:56px;font-weight:800;letter-spacing:-0.03em}
.dark{background:#111;color:#fff;padding:28px 36px;border-radius:20px}
.tab{background:#e9e5dc;border-radius:12px 12px 0 0;padding:10px 16px;display:inline-flex;gap:10px;align-items:center;font-size:14px}
.phone{width:300px;height:180px;grid-auto-rows:56px;border-radius:28px;background:linear-gradient(160deg,#3b5b7a,#1d2d3d);display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:22px;box-sizing:border-box}
.phone div{border-radius:13px;height:56px;background:rgba(255,255,255,.18)} .phone img{width:56px;height:56px;border-radius:13px}
</style></head><body>
<h1>Lokafête — icône</h1><p>Un chapiteau de cérémonie avec une étincelle de fête, sur fond doré.</p>
<div class="row">
 <div><img src="icon.svg" width="240"><div class="cap">Icône principale</div></div>
 <div><img src="icon-dark.svg" width="240"><div class="cap">Version sombre</div></div>
 <div><img src="icon.svg" width="96"><div class="cap">96 px</div></div>
 <div><img src="icon.svg" width="48"><div class="cap">48 px</div></div>
 <div><img src="icon.svg" width="32"><div class="cap">32 px</div></div>
 <div><img src="icon.svg" width="16"><div class="cap">16 px</div></div>
</div>
<div class="row">
 <div class="logo"><img src="icon.svg" width="72">Lokafête</div>
 <div class="logo dark" style="font-size:44px"><img src="icon-dark.svg" width="56">Lokafête</div>
</div>
<div class="row">
 <div><div class="tab"><img src="icon.svg" width="18">Lokafête — Gérez vos cérémonies</div><div class="cap">Onglet du navigateur</div></div>
 <div><div class="phone"><div></div><img src="icon.svg"><div></div><div></div><div></div><div></div><div></div><div></div></div><div class="cap">Écran d'accueil du téléphone</div></div>
</div>
</body></html>
