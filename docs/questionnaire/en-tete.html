<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1600px;height:400px;overflow:hidden;font-family:"DejaVu Sans","Liberation Sans",Arial,sans-serif}
  .b{position:relative;width:1600px;height:400px;background:linear-gradient(115deg,#fbf7ef 0%,#f6eedd 60%,#efe2c6 100%)}
  .txt{position:absolute;left:110px;top:0;height:400px;display:flex;flex-direction:column;justify-content:center;width:900px}
  .tag{display:inline-block;align-self:flex-start;font-size:26px;letter-spacing:3px;text-transform:uppercase;color:#8a6c36;border:2px solid #c1a26a;border-radius:40px;padding:8px 26px;margin-bottom:26px;background:rgba(255,255,255,.55)}
  h1{margin:0;font-size:70px;line-height:1.1;white-space:nowrap;color:#1a1a1a;font-weight:700;letter-spacing:-1.5px}
  h1 span{color:#a6874f}
  p{margin:24px 0 0;font-size:32px;color:#5b4a2c}
  svg{position:absolute;right:0;top:0}
</style></head><body><div class="b">
<div class="txt">
  <div class="tag">Petite étude · Bénin</div>

</div></body></html>
